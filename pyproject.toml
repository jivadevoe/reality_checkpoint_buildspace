[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buildspace"
version = "0.2.2"
description = "Local show-and-tell web app for coding agents: push code, diffs, diagrams, notes and video to a live timeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Reality Checkpoint", email = "hello@realitycheckpoint.org" }]
requires-python = ">=3.10"
keywords = ["claude-code", "agent", "visualization", "diff", "mermaid", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/jivadevoe/reality_checkpoint_buildspace"
Repository = "https://github.com/jivadevoe/reality_checkpoint_buildspace"
Issues = "https://github.com/jivadevoe/reality_checkpoint_buildspace/issues"

[project.scripts]
buildspace = "buildspace.cli:main"

[tool.setuptools.packages.find]
include = ["buildspace*"]

[tool.setuptools.package-data]
buildspace = ["static/*", "static/icons/*"]
